# Release: builds SquareMinimapButtons-<version>-forever.zip and release.json with tools/release.mjs,
# creates the tag v<version> and the GitHub release with both files as assets. Started by hand
# (Actions > Release > Run workflow) with the version from the TOC; with "dry run" it only builds
# the assets and keeps them as a workflow artifact, no tag and no release.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release; must equal "## Version:" in SquareMinimapButtons.toc (e.g. 1.0.1)'
        required: true
        type: string
      dry_run:
        description: 'Dry run: build and check the assets, create no tag and no release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the version against the TOC and the existing tags
        run: |
          set -eu
          toc=$(sed -n 's/^## Version:[[:space:]]*//p' SquareMinimapButtons/SquareMinimapButtons.toc | tr -d '\r')
          echo "TOC version: $toc, requested: $VERSION"
          test "$toc" = "$VERSION" || { echo "::error::the TOC says $toc, not $VERSION"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::the tag v$VERSION exists already"; exit 1
          fi

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Build the assets
        run: |
          set -eu
          npm run release:smb
          ls -l dist
          test -f "dist/SquareMinimapButtons-$VERSION-forever.zip"
          test -f dist/release.json
          cat dist/release.json
          grep -q "\"version\":\"$VERSION\"" dist/release.json
          unzip -tq "dist/SquareMinimapButtons-$VERSION-forever.zip"

      - name: Release notes from the changelog
        run: |
          set -eu
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' SquareMinimapButtons/CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::no section \"## $VERSION\" in SquareMinimapButtons/CHANGELOG.md"; exit 1
          fi
          printf '\n\nInstall the folder `SquareMinimapButtons` from the zip into `Interface\\AddOns`, or update through your addon manager.\n' >> notes.md
          cat notes.md

      - name: Keep the assets as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SquareMinimapButtons-${{ inputs.version }}
          path: |
            dist/SquareMinimapButtons-${{ inputs.version }}-forever.zip
            dist/release.json
            notes.md

      - name: Create the tag and the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "v$VERSION" \
            "dist/SquareMinimapButtons-$VERSION-forever.zip" \
            dist/release.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Square Minimap Buttons v$VERSION" \
            --notes-file notes.md
          echo "released v$VERSION from $GITHUB_SHA"
